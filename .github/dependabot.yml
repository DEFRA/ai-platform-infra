version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
  - package-ecosystem: npm
    directory: /checks
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
  - package-ecosystem: terraform
    directories:
      - /platform
      - /tenants
      - /bootstrap
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: fix
